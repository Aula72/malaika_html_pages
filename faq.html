<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAQ — Malaika</title>
  <meta name="description" content="Answers to common questions about Malaika." />
  <meta name="theme-color" content="#E8364F" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><ellipse cx='50' cy='16' rx='22' ry='7' fill='none' stroke='%23FFC233' stroke-width='6'/><circle cx='50' cy='60' r='36' fill='%23E8364F'/></svg>" />
  <script>try{var t=JSON.parse(localStorage.getItem("malaika:theme"));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="faq">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="scroll-progress" id="scrollProgress"></div>
  <header class="nav" id="siteHeader"></header>

  <main id="main">
    <section class="page-hero">
      <div class="blob blob-1"></div>
      <div class="container page-hero-grid">
        <div class="reveal">
          <span class="eyebrow" data-i18n="faq.hero.eyebrow"></span>
          <h1 data-i18n="faq.hero.title"></h1>
          <p class="lead" data-i18n="faq.hero.sub"></p>
        </div>
      </div>
    </section>

    <section class="section tight-top">
      <div class="container narrow">
        <div class="faq-tools reveal">
          <label class="search">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input type="search" id="faqSearch" data-i18n-placeholder="faq.search" aria-label="Search" autocomplete="off" />
          </label>
          <div class="chips" id="faqChips" role="group" aria-label="Categories"></div>
        </div>
        <div class="faq" id="faqList" aria-live="polite"></div>
        <p class="faq-empty" id="faqEmpty" data-i18n="faq.empty" hidden></p>
        <div class="still reveal">
          <h3 data-i18n="faq.still.title"></h3>
          <a href="join.html#contact" class="btn btn-primary" data-i18n="faq.still.button"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="siteFooter"></footer>

  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/es.js"></script>
  <script src="js/i18n/de.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages/faq.js"></script>
</body>
</html>
